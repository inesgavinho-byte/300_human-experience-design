                $ref: '#/components/schemas/EnvelopeProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'

  /proposals/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPathParam'
    get:
      tags: [Proposals]
      summary: Get proposal by ID
      responses:
        '200':
          description: Proposal found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Proposals]
      summary: Update proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalUpdate'
      responses:
        '200':
          description: Proposal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Proposals]
      summary: Delete proposal
      responses:
        '204':
          description: Proposal deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────────────────────
  # WEBSOCKET
  # ─────────────────────────────────────────────────────────
  /ws/voice:
    get:
      tags: [WebSocket]
      summary: Voice streaming WebSocket
      description: |
        Upgrade to a WebSocket connection for real-time voice streaming.
        Supports bidirectional audio streaming for transcription and synthesis.
      parameters:
        - name: mode
          in: query
          required: true
          description: Voice session mode
          schema:
            type: string
            enum: [transcribe, synthesize, duplex]
        - name: language
          in: query
          schema:
            type: string
            default: en
        - name: format
          in: query
          schema:
            type: string
            enum: [pcm, mp3, ogg]
            default: pcm
      responses:
        '101':
          description: WebSocket upgrade accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login

  parameters:
    UUIDPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique resource identifier

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number for pagination

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

    SortParam:
      name: sort
      in: query
      schema:
        type: string
        example: created_at:desc
      description: Sort field and direction (field:asc or field:desc)

    FilterParam:
      name: filter
      in: query
      schema:
        type: string
      description: JSON-encoded filter object

  schemas:
    # ───────────────────────────────────────────────
    # ENUMS
    # ───────────────────────────────────────────────
    BuildingType:
      type: string
      enum:
        - residential
        - commercial
        - industrial
        - mixed_use
        - healthcare
        - education
        - hospitality
        - data_center
        - retail
        - office

    SolutionLevel:
      type: string
      enum:
        - basic
        - standard
        - premium
        - custom

    DetectionState:
      type: string
      enum:
        - detected
        - inferred
        - validated
        - rejected
        - pending

    RequirementCategory:
      type: string
      enum:
        - functional
        - technical
        - regulatory
        - sustainability
        - accessibility
        - security
        - safety
        - comfort
        - operational
        - aesthetic

    SystemCategory:
      type: string
      enum:
        - hvac
        - electrical
        - plumbing
        - fire_safety
        - security
        - it_network
        - lighting
        - elevator
        - bms
        - renewable_energy
        - av
        - structural

    # ───────────────────────────────────────────────
    # STANDARD ENVELOPE
    # ───────────────────────────────────────────────
    Meta:
      type: object
      required: [version, request_id, timestamp]
      properties:
        version:
          type: string
          example: "1.0"
        request_id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        timestamp:
          type: string
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.94
        needs_validation:
          type: boolean
          default: false
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer
            has_next:
              type: boolean
            has_prev:
              type: boolean

    Links:
      type: object
      required: [self]
      properties:
        self:
          type: string
          format: uri
        related:
          type: object
          additionalProperties:
            type: string
            format: uri

    Envelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
        meta:
          $ref: '#/components/schemas/Meta'
        links:
          $ref: '#/components/schemas/Links'

    # ───────────────────────────────────────────────
    # ERROR SCHEMAS
    # ───────────────────────────────────────────────
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        details:
          type: object

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    # ───────────────────────────────────────────────
    # AUTH SCHEMAS
    # ───────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # ───────────────────────────────────────────────
    # PROFILE SCHEMAS
    # ───────────────────────────────────────────────
