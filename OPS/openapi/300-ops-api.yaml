openapi: 3.1.0
info:
  title: 300 OPS Platform API
  description: |
    300 OPS is an engineering platform for smart buildings. This API provides
    comprehensive access to project management, engineering evaluation,
    prescription management, procurement, document generation, integrations,
    and AI services.
  version: 1.0.0
  contact:
    name: 300 OPS Support
    email: api@300ops.com
  license:
    name: Proprietary
    url: https://300ops.com/license

servers:
  - url: https://api.300ops.com/v1
    description: Production server
  - url: https://staging-api.300ops.com/v1
    description: Staging server

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Profiles
    description: User profile management
  - name: Projects
    description: Project lifecycle management
  - name: Buildings
    description: Building hierarchy and management
  - name: Floors
    description: Floor management within buildings
  - name: Rooms
    description: Room and space management
  - name: Requirements
    description: Technical and functional requirements
  - name: Experiences
    description: User experience definitions
  - name: Systems
    description: Building systems management
  - name: Subsystems
    description: Subsystem management
  - name: Equipment
    description: Equipment management and library
  - name: Equipment Library
    description: Master equipment catalog
  - name: Engineering Engine
    description: Core engineering evaluation engine
  - name: Prescriptions
    description: Technical prescriptions and recommendations
  - name: Technical Zones
    description: Zone definitions and management
  - name: Procurement
    description: Procurement and value engineering
  - name: Suppliers
    description: Supplier management
  - name: Clients
    description: Client management
  - name: Documents
    description: Document generation and management
  - name: Integrations
    description: System integrations and connectors
  - name: AI Services
    description: NLP, voice, and AI pattern services
  - name: AI Local Servers
    description: On-premise AI server management
  - name: AI Patterns
    description: Learned pattern management
  - name: Explanation Logs
    description: AI decision explanations
  - name: Domain Events
    description: Event logging and auditing
  - name: Privacy Matrix
    description: Privacy and compliance matrix
  - name: Engineering Rules
    description: Rule-based engineering logic
  - name: Proposals
    description: Proposal management
  - name: WebSocket
    description: Real-time streaming endpoints

paths:
  # ─────────────────────────────────────────────────────────
  # AUTHENTICATION
  # ─────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user
      description: Authenticate a user and return JWT tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Refresh an expired access token using a refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: Invalidate the current session tokens.
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ─────────────────────────────────────────────────────────
  # PROFILES
  # ─────────────────────────────────────────────────────────
  /profiles:
    get:
      tags: [Profiles]
      summary: List profiles
      description: Retrieve a paginated list of user profiles.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/FilterParam'
      responses:
        '200':
          description: List of profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfiles'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPathParam'
    get:
      tags: [Profiles]
      summary: Get profile by ID
      responses:
        '200':
          description: Profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Profiles]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profiles]
      summary: Delete profile
      responses:
        '204':
          description: Profile deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /profiles/me:
    get:
      tags: [Profiles]
      summary: Get current user profile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

